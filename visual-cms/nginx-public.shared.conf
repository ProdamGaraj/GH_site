# =============================================================================
# Shared server-level config for the public-site.
# Included (via `include`) inside the HTTPS server block of every
# nginx-public.<env>.conf. Holds everything identical across environments;
# per-env files differ only by `server_name`.
# Mounted in containers at /etc/nginx/snippets/visual-cms.conf
# =============================================================================

# SSL. Path is identical across envs; the actual cert/key content differs per
# host and is provided via the ./ssl bind-mount (not committed to git).
ssl_certificate     /etc/nginx/ssl/server.crt;
ssl_certificate_key /etc/nginx/ssl/server.key;

# -----------------------------------------------------------------------------
# Апстримы через ПЕРЕМЕННЫЕ, а не литеральные имена.
#
# С литеральным `proxy_pass http://backend:5000` nginx резолвит имя ОДИН РАЗ при
# загрузке конфига и держит адрес до перезапуска. Пересобрали backend — контейнер
# получил новый IP, а nginx стучится в старый и отдаёт 502 при живом бэкенде.
# Лечилось только `restart public-site`, и каждый раз это выглядело как поломка
# приложения.
#
# Переменная в proxy_pass заставляет резолвить на каждый запрос. resolver —
# встроенный DNS docker (127.0.0.11), valid=10s ограничивает кеш.
#
# ВАЖНО: с переменной nginx НЕ подставляет остаток location автоматически —
# целевой URI задаётся явно ($request_uri или rewrite ... break).
# -----------------------------------------------------------------------------
resolver 127.0.0.11 valid=10s ipv6=off;
set $upstream_backend        http://backend:5000;
set $upstream_frontend       http://frontend:3000;
set $upstream_estate_service http://estate-service:5100;
set $upstream_minio          http://minio:9000;
ssl_protocols       TLSv1.2 TLSv1.3;

root /usr/share/nginx/html;
index index.html;

# Ensure Russian/Cyrillic text is served correctly
charset utf-8;
charset_types text/html text/css text/plain application/json application/javascript;

# Gzip compression
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

# Cache static assets
location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# HTML — no cache (so deploys are seen immediately)
location ~* \.html$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires off;
}

# Proxy API requests to backend (^~ takes priority over regex locations)
location ^~ /api/ {
    # Префикс совпадает с целевым путём, поэтому передаём исходный URI целиком.
    proxy_pass $upstream_backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Allow large media uploads (videos)
    client_max_body_size 250m;
}

# Estate module (ЖК) → estate-service. Заменяет vite dev-прокси /estate-api,
# который в проде обходится (браузер говорит с nginx, не с vite напрямую).
# Токен записи X-Estate-Token инжектится здесь (server-side, в браузер не попадает).
# Admin-write защищаем auth_request к сессии CMS: только залогиненный пользователь
# CMS может писать. Публичный read estate (/api/complexes) СМ ходит server-fetch
# внутри docker-сети, а не через этот location.
location ^~ /estate-api/ {
    auth_request /_estate_auth;
    # Префикс срезается rewrite-ом: с переменной nginx этого сам не сделает.
    rewrite ^/estate-api/(.*)$ /$1 break;
    proxy_pass $upstream_estate_service;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # ВНИМАНИЕ: должен совпадать с ESTATE_WRITE_TOKEN сервиса. Сменить в проде.
    proxy_set_header X-Estate-Token "dev-estate-write-token-change-me";
    client_max_body_size 50m;
}

# Внутренний сабзапрос валидации сессии CMS для auth_request (снаружи не виден).
# 200 (requireAuth пропустил) → доступ к /estate-api разрешён, 401 → 401.
location = /_estate_auth {
    internal;
    proxy_pass $upstream_backend/api/auth/me;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
}

# Карта проекта: тайлы OpenStreetMap, шрифты подписей, спрайт и MapLibre
# (собирает scripts/map/build-map-assets.sh в visual-cms/map-assets).
# Отдельный каталог, а не public-site: один экземпляр на сервер, деплой
# сайтов его не трогает. Тайлы и библиотеки — с версией в имени, их кэшируем
# надолго; стиль и описание сборки переключаются пересборкой — без кэша.
# Range-запросы (из них читается PMTiles) nginx отдаёт для статики сам.
location = /map/style.json {
    alias /usr/share/nginx/map/style.json;
    add_header Cache-Control "no-cache" always;
}

location = /map/manifest.json {
    alias /usr/share/nginx/map/manifest.json;
    add_header Cache-Control "no-cache" always;
}

location ^~ /map/ {
    alias /usr/share/nginx/map/;
    # Один заголовок: expires добавил бы второй Cache-Control. Без always —
    # иначе 404 (карта запрошена до сборки) закэшировался бы на месяц.
    add_header Cache-Control "public, max-age=2592000";
}

# Public Media Library — proxy to MinIO bucket cms-media
location ^~ /media/ {
    rewrite ^/media/(.*)$ /cms-media/$1 break;
    proxy_pass $upstream_minio;
    proxy_http_version 1.1;
    # Send the upstream host, NOT the original $host: MinIO rejects hostnames
    # with underscores (test_analytics.gh.uz) with 400 "invalid hostname".
    # Задан явно, а не через $proxy_host: апстрим теперь переменная, и полагаться
    # на выведенное из неё значение здесь незачем.
    proxy_set_header Host "minio:9000";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors on;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# Visual CMS admin UI (Vite dev server) under a path prefix on this same domain.
# Requires base: '/visual_cms/' in frontend/vite.config.ts + a matching router
# basename so the SPA's assets/HMR/routes resolve under the prefix. ^~ wins over
# the regex asset-cache location and the @sites_fallback below. No trailing slash
# on proxy_pass: the /visual_cms/ prefix is forwarded as-is (Vite base expects it).
location = /visual_cms { return 301 /visual_cms/; }
location ^~ /visual_cms/ {
    # Префикс /visual_cms/ форвардится как есть — этого ждёт base у Vite.
    proxy_pass $upstream_frontend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket upgrade for Vite HMR
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 86400s;

    client_max_body_size 250m;
}

# Site path-prefix routing: /sites/<slug>/<page> (direct access)
# Директорный формат (<page>/index.html) важнее legacy плоского <page>.html.
location ^~ /sites/ {
    try_files $uri $uri/ $uri.html =404;
}

# Clean URLs — try root first, then look in sites/<first-segment>/
# /golden-house → sites/golden-house/index.html
location / {
    # No cache for HTML (so deploys are seen immediately)
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires off;
    try_files $uri $uri/ $uri.html @sites_fallback;
}

# Fallback: extract first path segment as site slug and look in sites/<slug>/
location @sites_fallback {
    rewrite ^/([^/]+)(/.*)?$ /sites/$1$2 last;
}

# Security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
