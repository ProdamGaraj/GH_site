# Security headers. nginx does NOT inherit add_header into a location that has
# its own add_header — so every such location includes this file explicitly.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Empty on environments without a trusted certificate (HSTS= in .env).
add_header Strict-Transport-Security $gh_hsts always;
