# =============================================================================
# Locations of the HTTPS server (included from templates/default.conf.template).
# Production counterpart of nginx-public.shared.conf (local dev). Differences:
#   - /visual_cms/ is served as static files (no Vite dev server / HMR);
#   - write tokens come from .env via $estate_write_token / $news_write_token;
#   - /media/ is cached on disk in front of MinIO;
#   - security headers are repeated in every location that sets add_header.
# Keep the two files in sync when adding public routes.
# =============================================================================

# Upstreams via VARIABLES: nginx re-resolves the name per request (docker DNS),
# so a recreated container with a new IP does not leave nginx on the old one
# (502 until restart). With a variable, the URI must be passed explicitly.
resolver 127.0.0.11 valid=10s ipv6=off;
set $upstream_backend        http://backend:5000;
set $upstream_estate_service http://estate-service:5100;
set $upstream_news_service   http://news-service:5200;
set $upstream_minio          http://minio:9000;

root /usr/share/nginx/html;
index index.html;

include /etc/nginx/snippets/security-headers.conf;

# Dotfiles in the published site are never public (ACME lives on :80).
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# Commerce moved from /commercev2/ to /commerce/ (2026-10-09). Regex is quoted:
# unquoted «{2}» is parsed as a block start and nginx refuses to start.
location ~ "^/([a-z]{2})/commercev2(?:/(.*))?$" { return 301 /$1/commerce/$2; }
location ~ "^/commercev2(?:/(.*))?$" { return 301 /commerce/$1; }

# Static assets of the published site (same extension list and TTL as dev).
location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000, immutable";
}

# HTML — never cached, so a deploy is visible immediately.
location ~* \.html$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Robots-Tag $gh_robots_tag always;
}

location = /favicon.ico {
    access_log off;
    log_not_found off;
    try_files $uri =204;
}

# Custom 404 (written by the site deploy, publishedSeo.ts); internal = not
# reachable directly with status 200.
location = /404.html {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag $gh_robots_tag always;
}

# ---------------------------------------------------------------- backend API
location ^~ /api/ {
    proxy_pass $upstream_backend$request_uri;
    include /etc/nginx/snippets/proxy.conf;
    # Media uploads (video) and long site/collection deploys.
    client_max_body_size 250m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# ------------------------------------------------- estate admin (CMS only)
# Write token is injected here; access only with a valid CMS session
# (auth_request → /api/auth/me). Public estate reads go container-to-container.
location ^~ /estate-api/ {
    auth_request /_cms_auth;
    rewrite ^/estate-api/(.*)$ /$1 break;
    proxy_pass $upstream_estate_service;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header X-Estate-Token $estate_write_token;
    client_max_body_size 50m;
}

# Session check subrequest for auth_request: 200 → allowed, 401 → 401.
location = /_cms_auth {
    internal;
    proxy_pass $upstream_backend/api/auth/me;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
}

# --------------------------------------------------- news admin (CMS only)
location ^~ /news-api/ {
    auth_request /_cms_auth;
    rewrite ^/news-api/(.*)$ /$1 break;
    proxy_pass $upstream_news_service;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header X-News-Token $news_write_token;
    client_max_body_size 10m;
}

# Public news feed (infinite scroll / filters on /news): read-only, no token,
# no session. Longer prefix than /news-api/ → wins. nginx normalises the URI
# before matching, so "../" cannot escape into the admin API.
location ^~ /news-api/public/ {
    limit_req zone=news_public burst=20 nodelay;
    limit_except GET HEAD { deny all; }
    rewrite ^/news-api/public/(.*)$ /api/public/$1 break;
    proxy_pass $upstream_news_service;
    include /etc/nginx/snippets/proxy.conf;
}

# ------------------------------------------------------------ project map
# Built by scripts/map/build-map-assets.sh into ./map-assets (one copy per
# server; site deploys never touch it).
location = /map/style.json {
    alias /usr/share/nginx/map/style.json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

location = /map/manifest.json {
    alias /usr/share/nginx/map/manifest.json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

location ^~ /map/ {
    alias /usr/share/nginx/map/;
    include /etc/nginx/snippets/security-headers.conf;
    # No `always`: a 404 (map not built yet) must not be cached for a month.
    add_header Cache-Control "public, max-age=2592000";
}

# ------------------------------------------------------------------ media
# MinIO bucket cms-media, cached on disk (proxy_cache_path in the template).
# slice: large videos are fetched and cached in 1 MB pieces, so a seek does
# not pull the whole file through nginx first.
location ^~ /media/ {
    rewrite ^/media/(.*)$ /cms-media/$1 break;
    proxy_pass $upstream_minio;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Upstream host, NOT $host: MinIO rejects hostnames with underscores
    # (test_analytics.gh.uz) with 400 "invalid hostname".
    proxy_set_header Host "minio:9000";

    slice 1m;
    proxy_set_header Range $slice_range;
    proxy_cache media;
    proxy_cache_key $uri$is_args$args$slice_range;
    proxy_cache_valid 200 206 30d;
    proxy_cache_valid 404 1m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;

    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header Cache-Control "public, max-age=2592000, immutable";
}

# --------------------------------------------------------- CMS admin (SPA)
# Built into the image at /usr/share/nginx/cms/visual_cms (vite base
# /visual_cms/). Unknown paths → index.html (client-side routing).
location = /visual_cms { return 301 /visual_cms/; }
location ^~ /visual_cms/ {
    root /usr/share/nginx/cms;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri /visual_cms/index.html;

    # Hashed bundles: cache forever, a new build gets new file names.
    location ^~ /visual_cms/assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }
}

# ------------------------------------------------------- published sites
# /sites/<slug>/<page>: directory format (<page>/index.html) wins over the
# legacy flat <page>.html.
location ^~ /sites/ {
    error_page 403 404 =404 /404.html;
    try_files $uri $uri/ $uri.html =404;
}

# Clean URLs: try the root first, then sites/<first-segment>/.
location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Robots-Tag $gh_robots_tag always;
    error_page 403 404 =404 /404.html;
    try_files $uri $uri/ $uri.html @sites_fallback;
}

location @sites_fallback {
    rewrite ^/([^/]+)(/.*)?$ /sites/$1$2 last;
}
