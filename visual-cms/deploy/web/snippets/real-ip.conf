# Real client IP behind a CDN / edge reverse proxy.
#
# Empty by default: nginx sees the TCP peer as the client. If traffic goes
# through Cloudflare or another proxy, ALL visitors would share a few proxy IPs
# and hit the per-IP rate limits (backend 429, news feed limit_req). In that
# case list the proxy networks here and rebuild the web image, e.g.:
#
#   set_real_ip_from 173.245.48.0/20;   # one line per CDN range
#   real_ip_header   CF-Connecting-IP;  # Cloudflare; X-Forwarded-For for others
#   real_ip_recursive on;
#
# Never trust 0.0.0.0/0 — any client could then spoof its IP.
