# =============================================================================
# Main nginx config of the production "web" container.
# Site-specific parts: templates/default.conf.template (rendered per env at
# start) and snippets/site.conf (locations).
# =============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # Browsers keep idle keep-alive connections: size for many concurrent
    # visitors, not for requests per second.
    worker_connections 8192;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time cache=$upstream_cache_status';
    # The official image links these to the container's stdout/stderr;
    # docker rotates them (logging options in docker-compose.production.yml).
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    server_tokens off;

    # No open_file_cache on purpose: site deploys replace HTML files in place and
    # must be visible immediately.

    charset utf-8;
    # text/html is always included by nginx.
    charset_types text/css text/plain application/json application/javascript;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/manifest+json image/svg+xml;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Real client IP when a CDN / edge proxy sits in front (empty by default).
    include /etc/nginx/snippets/real-ip.conf;

    include /etc/nginx/conf.d/*.conf;
}
